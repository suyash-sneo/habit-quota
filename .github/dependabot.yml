version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint pins `typescript <6.1.0`, so a TypeScript major bump
      # produces an unresolvable tree. Lift this once the linter supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      # Review the service worker and crypto surface deliberately, together.
      pwa:
        patterns:
          - 'vite-plugin-pwa'
          - 'workbox-*'
      dev-tooling:
        patterns:
          - '@types/*'
          - 'eslint*'
          - 'typescript*'
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
